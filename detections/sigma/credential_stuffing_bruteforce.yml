title: Credential Stuffing / Brute Force Authentication Burst
id: credential_stuffing_bruteforce
status: stable
description: >
  Detects a burst of failed authentication attempts against one or more
  accounts in a short window, consistent with credential stuffing using
  a breached-password list or automated brute forcing.
author: SOC Navigator
date: 2026-01-01
logsource:
  category: authentication
  product: identity_provider
detection:
  selection:
    event_type: authentication
    result: failure
  selection_volume:
    failed_count|gte: 50
  condition: selection and selection_volume
level: medium
tags:
  - attack.credential_access
  - attack.t1110.004
falsepositives:
  - Misconfigured application retry logic
  - Internal load or QA testing
  - Shared-device password-expiration events
confidence:
  base: 55
  increase:
    - factor: "Failed attempts originated from a single external source"
      field_check: {field: single_source, equals: true}
      weight: 15
    - factor: "Attempts targeted multiple valid usernames"
      field_check: {field: multiple_usernames, equals: true}
      weight: 15
    - factor: "Failure volume exceeds 300 attempts"
      field_check: {field: failed_count, gte: 300}
      weight: 15
  decrease:
    - factor: "Attempts originated from a known internal load-testing/QA source"
      field_check: {field: known_test_source, equals: true}
      weight: -40
