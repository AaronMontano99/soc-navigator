title: Credential Access via LSASS Memory
id: credential_dumping_lsass
status: stable
description: >
  Detects a process opening a handle to lsass.exe, the memory space
  Windows uses to cache credential material. Commonly abused to harvest
  password hashes/Kerberos tickets for offline cracking or replay.
author: SOC Navigator
date: 2026-01-01
logsource:
  category: credential_access
  product: windows
detection:
  selection:
    event_type: credential_access
    target_process|contains: lsass
  condition: selection
level: critical
tags:
  - attack.credential_access
  - attack.t1003.001
falsepositives:
  - Authorized incident-response memory captures
  - EDR/AV self-protection scans
  - Backup or agent software reading process memory
confidence:
  base: 75
  increase:
    - factor: "Access rights requested include memory read (PROCESS_VM_READ)"
      field_check: {field: access_rights, equals: "PROCESS_VM_READ"}
      weight: 10
    - factor: "Performed by a tool not on the approved IR toolset"
      field_check: {field: process, not_in: [procdump.exe]}
      weight: 10
  decrease:
    - factor: "Performed by authorized incident-response tooling"
      field_check: {field: process, in: [procdump.exe]}
      weight: -40
    - factor: "User belongs to the IT/Administrators department"
      field_check: {field: user_department, equals: IT}
      weight: -15
